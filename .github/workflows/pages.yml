name: Pages

# 文档源码在 docs 分支，构建校验也在那边跑（Docs 工作流）。
# Pages 的 github-pages 环境只允许从 main 部署，所以部署放这里：
# 监听 Docs 跑完，再以 main 的身份检出 docs 分支内容并发布。
on:
  workflow_run:
    workflows: [Docs]
    types: [completed]
    branches: [docs]
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: docs
          path: site
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run docs:build
        working-directory: site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/docs/.vitepress/dist
      - name: 等 artifact 变成可查
        # deploy-pages 在 upload 完成 0.3 秒内就按名字去查，偶尔查到 0 个。
        # 这里用同样的查询口径（?name=github-pages）轮询到看得见为止。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            n=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" \
              | jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            echo "尝试 $i：github-pages artifact 数量 = $n"
            if [ "$n" -ge 1 ]; then exit 0; fi
            sleep 3
          done
          echo "artifact 一直查不到" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

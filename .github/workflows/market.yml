name: Market

on:
  push:
    branches: [main]
    paths: ['registry.json', 'verified.json', 'src/**', 'schemas/**', 'package.json']
  schedule:
    # 每天 03:00 UTC 重建一次，兜住作者仓库的日常更新
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: 构建市场索引
        run: node lib/index.js build --registry registry.json --out dist/market.json --report dist/report.md
      - name: 失败清单打到日志和 job summary
        if: always()
        run: |
          if [ -f dist/report.md ]; then
            cat dist/report.md
            cat dist/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: market
          path: dist/
